# Manage 服务配置

[server]
host = "0.0.0.0"
port = 8081

[database]
url = "mysql://root:password@localhost:3306/football"
# MySQL 连接池最大连接数
max_connections = 10

[redis]
# Redis 连接 URL
# 格式：redis://[:password@]host:port[/database]
# 有密码: redis://:your_password@localhost:6379/0
# 无密码: redis://localhost:6379/0
url = "redis://localhost:6379/0"
# Redis 连接池大小
pool_size = 10

[log]
# 日志级别: trace, debug, info, warn, error
level = "info"

