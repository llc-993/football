# Manage 服务生产环境配置

[server]
host = "0.0.0.0"
port = 8081

[database]
url = "mysql://user:password@prod-mysql:3306/football"
# 生产环境建议增加连接数
max_connections = 50

[redis]
# Redis 连接 URL（生产环境强烈建议设置密码）
# 格式：redis://[:password@]host:port[/database]
url = "redis://:your_secure_password@prod-redis:6379/0"
# 生产环境建议增加连接池大小
pool_size = 30

[log]
# 生产环境建议使用 warn 或 error
level = "warn"

