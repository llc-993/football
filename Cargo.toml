[workspace]
resolver = "2"
members = [
    "business",
    "manage",
    "common",
    "orm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Web框架
actix-web = "4.9"
actix-rt = "2.10"
actix-cors = "0.7"

# 异步运行时
tokio = { version = "1.40", features = ["full"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库 ORM
rbatis = "4.5"
rbdc = "4.5"
rbdc-mysql = "4.5"

# Redis
redis = { version = "0.32.0", features = ["tokio-comp", "connection-manager"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
env_logger = "0.11"

# 配置
config = "0.15.11"
dotenv = "0.15"

# 错误处理
anyhow = "1.0"
thiserror = "2.0.12"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 异步
async-trait = "0.1"
futures = "0.3"

# 工具
once_cell = "1.20"

# 国际化 (Fluent)
fluent = "0.17.0"
fluent-bundle = "0.16.0"
unic-langid = "0.9"

# 内部依赖
football-common = { path = "./common" }
football-orm = { path = "./orm" }

