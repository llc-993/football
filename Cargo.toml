[workspace]
resolver = "2"
members = [
    "business",
    "manage",
    "common",
    "orm",
    "spider",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Web框架
actix-web = "4.9"
actix-rt = "2.10"
actix-cors = "0.7"

# 异步运行时
tokio = { version = "1.40", features = ["full"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库 ORM
rbatis = "4.5"
rbdc = "4.5"
rbdc-mysql = "4.5"

# Redis
redis = { version = "0.32.0", features = ["tokio-comp", "connection-manager"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
env_logger = "0.11"

# 配置
config = "0.15.11"
dotenv = "0.15"

# 错误处理
anyhow = "1.0"
thiserror = "2.0.12"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 异步
async-trait = "0.1"
futures = "0.3"

# 工具
once_cell = "1.20"
uuid = { version = "1.10", features = ["v4", "serde"] }

# 精确数值计算
rust_decimal = { version = "1.35", features = ["serde"] }

# rbatis 序列化支持
rbs = "4.5"

# 国际化 (Fluent)
fluent = "0.17.0"
fluent-bundle = "0.16.0"
unic-langid = "0.9"

# 爬虫相关
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli"] }
scraper = "0.20"
select = "0.6"
toml = "0.8"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
url = "2.5"
regex = "1.11"
futures-util = "0.3"
headless_chrome = "1.0"
fantoccini = "0.19"
thirtyfour = "0.31"

# 内部依赖
football-common = { path = "./common" }
football-orm = { path = "./orm" }

# sa-token
#sa-token-core="0.1.7"
#sa-token-macro="0.1.7"
#sa-token-storage-redis = "0.1.7"
sa-token-plugin-actix-web={version = "0.1.7", features = ["redis"]}
#sa-token-adapter="0.1.7"